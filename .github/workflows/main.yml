name: generate arcade contribution graphs

on:
    schedule: # Jalan otomatis tiap 24 jam
        - cron: '0 0 * * *'
    workflow_dispatch: # Boleh dijalankan manual dari tab Actions
    push: # Jalan tiap ada push ke branch main
        branches:
            - main

jobs:
    generate:
        permissions:
            contents: write
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: generate contribution graph SVGs
              uses: abozanona/pacman-contribution-graph@main
              with:
                  github_user_name: ${{ github.repository_owner }}
                  # Bisa tambah game lain: breakout, galaga, puzzle-bobble, bomberman
                  games: 'pacman'

            - name: push SVGs to the output branch
              uses: crazy-max/ghaction-github-pages@v3.1.0
              with:
                  target_branch: output
                  build_dir: dist
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
